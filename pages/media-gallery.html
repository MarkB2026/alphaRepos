const grid=document.getElementById("grid"),q=document.getElementById("q"),type=document.getElementById("type"),counter=document.getElementById("count");
const box=document.getElementById("box"),full=document.getElementById("full");let last=null;
const url=f=>"/"+f.split("/").map(encodeURIComponent).join("/");
const title=f=>f.split("/").pop().replace(/\.[^.]+$/,"").replace(/[_-]+/g," ");
function show(f){last=document.activeElement;full.src=url(f);full.alt=title(f);box.hidden=false;document.body.style.overflow="hidden";document.getElementById("close").focus()}
function close(){box.hidden=true;full.src="";document.body.style.overflow="";last?.focus()}
document.getElementById("close").addEventListener("click",close);box.addEventListener("click",e=>{if(e.target===box)close()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!box.hidden)close()});
function render(){const term=q.value.trim().toLowerCase(),ty=type.value;const found=FILES.filter(f=>(ty==="all"||f.startsWith(ty+"/"))&&f.toLowerCase().includes(term));
grid.replaceChildren();const frag=document.createDocumentFragment();
for(const f of found){const fig=document.createElement("figure");fig.className="tile";const caption=document.createElement("figcaption");caption.textContent=title(f);const sub=document.createElement("small");sub.textContent=f;caption.append(sub);
if(f.startsWith("images/")){const btn=document.createElement("button");btn.type="button";btn.setAttribute("aria-label","Enlarge "+title(f));const im=document.createElement("img");im.loading="lazy";im.src=url(f);im.alt=title(f);btn.append(im);btn.addEventListener("click",()=>show(f));fig.append(btn)}
else{const vid=document.createElement("video");vid.controls=true;vid.preload="none";vid.playsInline=true;vid.setAttribute("aria-label",title(f));const source=document.createElement("source");source.src=url(f);source.type="video/mp4";vid.append(source);fig.append(vid)}
fig.append(caption);frag.append(fig)}
grid.append(frag);counter.textContent=found.length+" file"+(found.length===1?"":"s")}
q.addEventListener("input",render);type.addEventListener("change",render);render();
</script></body></html>
