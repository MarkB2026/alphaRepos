<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraderRepository — Developer Terminal Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b1018;
  --ink:#eaf0f4;      /* trader, repos */
  --code:#31c6e8;     /* </> and cursor */
  --suffix:#89919c;   /* itory */
  --prompt:#3fb950;   /* terminal green */
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink)}

.logo{
  display:flex;align-items:baseline;white-space:nowrap;
  font:700 clamp(20px,5vw,68px)/1.15 'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;
  letter-spacing:-.02em;
  text-shadow:0 0 .35em rgba(49,198,232,.12);   /* faint phosphor glow */
}
.prompt{color:var(--prompt);margin-right:.55em;font-weight:700}
.trader,.repos{color:var(--ink)}
.code{color:var(--code);margin:0 .18em}
.suffix{color:var(--suffix);font-weight:500}
.cursor{
  display:inline-block;width:.6em;height:.94em;
  background:var(--code);margin-left:.08em;
  vertical-align:-.2em;border-radius:.06em;
  animation:blink 1.06s steps(1,end) infinite;
}
.typing .cursor{animation:none}   /* solid while typing, like a real terminal */
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .cursor{animation:none}
}
</style>
</head>
<body>
<div class="logo" role="img" aria-label="TraderRepository">
  <span class="prompt" aria-hidden="true">&#10095;</span><span class="trader">trader</span><span class="code">&lt;/&gt;</span><span class="repos">repos</span><span class="suffix" data-text="itory"></span><span class="cursor" aria-hidden="true"></span>
</div>
<script>
(function(){
  var logo=document.querySelector('.logo'), el=logo.querySelector('.suffix'), text=el.dataset.text;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=text; return; }
  var i=0, start=900, step=190;                 // pause, then one character every 190ms
  logo.classList.add('typing');
  setTimeout(function type(){
    el.textContent=text.slice(0,++i);
    if(i<text.length) setTimeout(type,step); else logo.classList.remove('typing');
  },start);
})();
</script>
</body>
</html>
