<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trader Repository | Admin 2026</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a1421;color:#e8f2ff;font:15px system-ui,Segoe UI,sans-serif}header{padding:17px 23px;background:#101f31;border-bottom:1px solid #32465e;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#9fb5cb}nav{display:flex;gap:7px;overflow:auto;padding:12px 18px;background:#0c1828;border-bottom:1px solid #32465e}.tab{white-space:nowrap;border:1px solid #36516b;background:#14273b;color:#d4e4f4;border-radius:8px;padding:10px 15px;cursor:pointer}.tab[aria-selected=true]{background:#215f6c;border-color:#64d5cb;color:white}iframe{width:100%;height:calc(100vh - 143px);border:0;background:#091321}a{color:#87d7ed} .note{font-size:12px;color:#b7c8d9}</style></head><body>
<header><div><h1>TRADER REPOSITORY / ADMIN 2026</h1><div class="sub">Admin hub · Release ratings and operations references</div></div><div class="note">Public <code>index.html</code> remains Hello world · <a href="products.html" target="_blank" rel="noopener">Open product page ↗</a></div></header>
<nav role="tablist" aria-label="Administration tools"><button type="button" data-file="rating.html" class="tab" role="tab" aria-selected="true">Ratings</button>
<button type="button" data-file="products.html" class="tab" role="tab" aria-selected="false">Product Page</button>
<button type="button" data-file="GITHUB_SETUP.html" class="tab" role="tab" aria-selected="false">GitHub Setup</button>
<button type="button" data-file="GITHUB_SETTINGS.html" class="tab" role="tab" aria-selected="false">GitHub Settings</button>
<button type="button" data-file="CLOUDFLARE_SETUP.html" class="tab" role="tab" aria-selected="false">Cloudflare</button>
<button type="button" data-file="INSTALL_CHECKLIST.html" class="tab" role="tab" aria-selected="false">Install Checklist</button>
<button type="button" data-file="RELEASE_NOTES.html" class="tab" role="tab" aria-selected="false">Release Notes</button></nav>
<iframe id="panel" title="Release ratings" src="rating.html"></iframe>
<script>const tabs=[...document.querySelectorAll('.tab')],panel=document.getElementById('panel');tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(b=>b.setAttribute('aria-selected',String(b===t)));panel.src=t.dataset.file;panel.title=t.textContent;}));</script>
</body></html>
