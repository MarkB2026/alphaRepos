<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b111b"><title>Trader Repository | Admin 2026</title>
<style>
:root{color-scheme:dark;--bg:#0b111b;--panel:#111c2b;--line:#2c3f54;--cyan:#39bff0;--text:#e4edf8;--muted:#9badc2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,'Segoe UI',Arial,sans-serif}header{padding:16px 22px;background:#0d1724;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font:700 20px/1.3 Consolas,monospace;margin:0}h1 span{color:var(--cyan)}.sub{font-size:12px;color:var(--muted);margin-top:4px}.links{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}.links a{color:#8bd7f6;text-decoration:none}.links a:hover{text-decoration:underline}.summary{display:flex;gap:9px;flex-wrap:wrap;padding:11px 20px;background:#0f1b29;border-bottom:1px solid var(--line)}.stat{background:#14283c;border:1px solid #35526b;border-radius:6px;padding:5px 10px;font:12px Consolas,monospace;color:#d6ebfa}.stat strong{color:#70d0fa}nav{display:flex;gap:7px;overflow-x:auto;padding:11px 18px;background:#0c1828;border-bottom:1px solid var(--line)}.tab{white-space:nowrap;border:1px solid #36516b;background:#14273b;color:#d4e4f4;border-radius:7px;padding:9px 13px;cursor:pointer;font:600 12px system-ui,sans-serif}.tab:hover{border-color:#5aaed1}.tab[aria-selected=true]{background:#176077;border-color:#77d9ef;color:white}.tab:focus-visible{outline:2px solid #79d4f7;outline-offset:2px}iframe{display:block;width:100%;height:calc(100vh - 196px);min-height:400px;border:0;background:#091321}.note{font-size:12px;color:var(--muted)}@media(max-width:700px){header{padding:13px}.summary{padding:9px 13px}nav{padding:9px 13px}iframe{height:calc(100vh - 230px)}}
</style></head><body>
<header><div><h1>trader <span>&lt;/&gt; repository</span> / ADMIN 2026</h1><div class="sub">Release ratings · Catalog · Bundles · Operations</div></div><div class="links"><a href="index.html" target="_blank" rel="noopener">Public catalog ↗</a><a href="packages.html" target="_blank" rel="noopener">Packages ↗</a><a href="products.html" target="_blank" rel="noopener">Product page ↗</a></div></header>
<div class="summary" aria-label="Repository inventory"><span class="stat"><strong>33</strong> applications</span><span class="stat"><strong>10</strong> bundles</span><span class="stat"><strong>5</strong> Battle Tested</span><span class="stat"><strong>6</strong> Autonomous Capable</span><span class="stat">Release ratings: <strong>preserved in product records</strong></span></div>
<nav role="tablist" aria-label="Administration tools">
<button type="button" data-file="rating.html" class="tab" role="tab" aria-controls="panel" aria-selected="true">Ratings</button>
<button type="button" data-file="index.html" class="tab" role="tab" aria-controls="panel" aria-selected="false">Software Catalog</button>
<button type="button" data-file="packages.html" class="tab" role="tab" aria-controls="panel" aria-selected="false">Packages</button>
<button type="button" data-file="products.html" class="tab" role="tab" aria-controls="panel" aria-selected="false">Product Page</button>
<button type="button" data-file="GITHUB_SETUP.html" class="tab" role="tab" aria-controls="panel" aria-selected="false">GitHub Setup</button>
<button type="button" data-file="GITHUB_SETTINGS.html" class="tab" role="tab" aria-controls="panel" aria-selected="false">GitHub Settings</button>
<button type="button" data-file="CLOUDFLARE_SETUP.html" class="tab" role="tab" aria-controls="panel" aria-selected="false">Cloudflare</button>
<button type="button" data-file="INSTALL_CHECKLIST.html" class="tab" role="tab" aria-controls="panel" aria-selected="false">Install Checklist</button>
<button type="button" data-file="RELEASE_NOTES.html" class="tab" role="tab" aria-controls="panel" aria-selected="false">Release Notes</button>
</nav>
<iframe id="panel" name="admin-panel" title="Release ratings" src="rating.html"></iframe>
<script>(function(){const tabs=[...document.querySelectorAll('.tab')],panel=document.getElementById('panel');function select(t){tabs.forEach(b=>{b.setAttribute('aria-selected',String(b===t));b.tabIndex=b===t?0:-1});panel.src=t.dataset.file;panel.title=t.textContent.trim()}tabs.forEach(t=>{t.addEventListener('click',()=>select(t));t.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;e.preventDefault();const i=tabs.indexOf(t),next=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];next.focus();select(next)})});tabs.forEach((t,i)=>t.tabIndex=i===0?0:-1)})();</script>
</body></html>
